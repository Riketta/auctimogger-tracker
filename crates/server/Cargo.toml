[package]
name = "amtracker-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Driving adapters for the auctimogger-tracker: TOML config loading, HTTP API + UI, poll-loop scheduler, CLI."

[dev-dependencies]
amtracker-infra = { path = "../infra" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[dependencies]
amtracker-core = { path = "../core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = "0.1"
