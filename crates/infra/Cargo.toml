[package]
name = "amtracker-infra"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Driven adapters for the auctimogger-tracker: SQLite repositories, Blizzard-format source, item info, feed rendering/publishing, clock."

[lints]
workspace = true

[dependencies]
amtracker-core = { path = "../core" }
base64 = "0.22"
# Raw payload archives are gzip-compressed at write time (pure-Rust
# miniz_oxide backend — no C/zlib dependency); nothing reads them back in
# production, so the format change needs no compatibility layer.
flate2 = "1"
httpdate = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ureq = { version = "2.10", features = ["json"] }
