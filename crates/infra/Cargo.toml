[package]
name = "amtracker-infra"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Driven adapters for the auctimogger-tracker: SQLite repositories, Blizzard-format source, item info, feed rendering/publishing, clock."

[lints]
workspace = true

[dependencies]
amtracker-core = { path = "../core" }
base64 = "0.22"
httpdate = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
ureq = "2.10"
