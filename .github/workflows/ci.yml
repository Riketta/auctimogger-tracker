name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux · fmt / clippy / test / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml uses unstable options, so formatting must run under
      # nightly rustfmt; clippy/tests/build stay on the stable toolchain
      # pinned by rust-toolchain.toml (installed explicitly because plain
      # `cargo` must resolve stable regardless of install order).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (nightly rustfmt options)
        run: cargo +nightly fmt --all --check

      - name: "Clippy (workspace lints: pedantic + denied unwrap/expect/panic/indexing/slicing)"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (incl. hexagonal boundary checks)
        run: cargo test --workspace

      - name: Deny (licenses / advisories / bans / sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  windows:
    name: Windows · clippy / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  # Addon gates (addon/SPEC.md section 9). The Lua tools are pinned to the
  # same versions the local gate uses (addon/scripts/bootstrap-tools.sh and
  # addon/scripts/ci_local.sh), so a green run here means the same locally.
  addon:
    name: Addon · stylua / luacheck / busted / guards / LuaLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: luarocks/gh-actions-luarocks@v5

      - name: Install Lua tooling
        run: |
          luarocks install luacheck 1.2.0-1
          luarocks install busted 2.2.0-1

      - uses: taiki-e/install-action@v2
        with:
          tool: stylua@2.6.0

      # StyLua resolves .stylua.toml per file, so this honors addon/.stylua.toml.
      - name: Format check (StyLua)
        run: stylua --check addon

      # luacheck reads .luacheckrc only from the CURRENT directory: run from
      # the repo root it would be unconfigured and fail on every game global.
      - name: Lint + boundary rules (luacheck)
        run: (cd addon && luacheck .)

      - name: Unit tests (busted, no game client required)
        run: (cd addon && busted --verbose)

      - name: TOC coverage guard (every lua file must be loaded by the game)
        run: lua addon/scripts/check_toc.lua addon/AuctiMoggerDatabase/AuctiMoggerDatabase.toc

      - name: Compat manifest guard (every game surface the addon touches must be listed)
        # Diffs the manifest of AuctiMoggerDatabase/Adapters/compat.lua against
        # the lint allowlists and against the TOC-loaded sources; fails on drift.
        run: lua addon/scripts/check_compat.lua

      - name: Type check (lua-language-server, strict)
        env:
          # Pin the LuaLS release; bump deliberately.
          LLS_VERSION: 3.19.1
        run: |
          # Download and extract OUTSIDE the checked tree ($RUNNER_TEMP): an
          # un-ignored lls/ dir inside the workspace would be scanned by --check.
          curl -fL "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" -o "$RUNNER_TEMP/lls.tar.gz"
          mkdir -p "$RUNNER_TEMP/lls"
          tar -xzf "$RUNNER_TEMP/lls.tar.gz" -C "$RUNNER_TEMP/lls"
          # stdout IS the report; the exit code of the CLI is not trusted, the
          # assert reads the report and fails safe when it cannot be parsed.
          "$RUNNER_TEMP/lls/bin/lua-language-server" --check=addon --checklevel=Warning > ./addon/lls.log 2>&1 || true
          lua addon/scripts/assert_lls_clean.lua ./addon/lls.log

  # Publishes only from main and v* tags (plus manual dispatch on those
  # refs): manual runs on feature branches must not silently publish.
  # versa-bot precedent for the gate, the sha tag and the timeout.
  docker:
    name: Docker · build & publish to GHCR
    needs: [linux, addon]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release · ${{ matrix.target }}
    # Runs on version tags and on manual dispatch (to keep the pipeline warm);
    # artifacts are only PUBLISHED from tags (see the publish job).
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [linux, addon]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite is bundled, so no system SQLite is needed; --locked keeps
      # release builds reproducible against the committed Cargo.lock.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          name="auctimogger-tracker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/auctimogger-tracker" "dist/${name}/"
          cp config.example.toml recipes.example.toml "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "auctimogger-tracker-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/auctimogger-tracker.exe" "dist/$name/"
          Copy-Item config.example.toml, recipes.example.toml "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      # The addon ships with the release (addon/SPEC.md, section 6.7): the
      # deployable folder with its placeholder slots, zipped once (the Linux
      # leg) with the folder at the archive root, so it extracts straight into
      # Interface/AddOns. The checkout keeps it LF through .gitattributes.
      - name: Package (addon)
        if: runner.os == 'Linux'
        run: zip -r -X ../dist/AuctiMoggerDatabase.zip AuctiMoggerDatabase
        working-directory: addon

      - uses: actions/upload-artifact@v4
        with:
          name: auctimogger-tracker-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Attach archives to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
