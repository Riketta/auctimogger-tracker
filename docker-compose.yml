# Demo stack: `docker compose up --build` starts the tracker (scheduler +
# web UI on :8080) with persistent storage, plus a small feed exporter loop
# so /feed.lua and /feed.json stay fresh without a host cron.
#
# Edit ./config.docker.toml to choose targets; tokens come from the
# environment (a .env file next to this file works: AMT_TOKEN=...,
# AMT_API_TOKEN=...).

services:
  tracker:
    build: .
    image: auctimogger-tracker:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.toml:/work/config.toml:ro
      - amtracker-data:/data
      - amtracker-feeds:/work/feeds
    environment:
      # Blizzard targets only; static-urls targets need no token.
      AMT_TOKEN: ${AMT_TOKEN:-}
      # Set this to protect the mutating API (watchlist, /api/fetch).
      AMT_API_TOKEN: ${AMT_API_TOKEN:-}

  feed-exporter:
    # Same image as the tracker; renders feed.lua + feed.json every 5 minutes
    # so the /feed.lua / /feed.json downloads serve fresh data. The in-game
    # addon can live off /feed-slim.lua alone (rendered on demand) — disable
    # this service if you only use the slim feed.
    image: auctimogger-tracker:local
    restart: unless-stopped
    depends_on:
      - tracker
    volumes:
      - ./config.docker.toml:/work/config.toml:ro
      - amtracker-data:/data
      - amtracker-feeds:/work/feeds
    entrypoint: ["sh", "-c"]
    command:
      - |
        while :; do
          auctimogger-tracker export-feed --config /work/config.toml --out /work/feeds
          sleep 300
        done

volumes:
  amtracker-data:
  amtracker-feeds:
