# Demo stack: `docker compose up --build` starts the tracker — the scheduler
# ingests on cadence, applies raw-listing retention, and re-publishes
# feed.lua / feed.json itself, so no exporter sidecar or host cron is needed.
#
# Edit ./config.docker.toml to choose targets; secrets come from the
# environment (a .env file next to this file works: BLIZZARD_CLIENT_ID=...,
# BLIZZARD_CLIENT_SECRET=..., AMT_API_TOKEN=...). The compose default token
# is the well-known dev token below: the server runs with it but WARNS at
# startup — replace it (or set a real AMT_API_TOKEN in .env) before exposing
# the instance beyond localhost. An EMPTY token makes `serve` refuse to start
# on this non-loopback bind (that is the safety guard; see
# config.docker.toml's [server] comments).

services:
  tracker:
    build: .
    image: auctimogger-tracker:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.toml:/work/config.toml:ro
      - amtracker-data:/data
      - amtracker-feeds:/work/feeds
    environment:
      # Blizzard targets only; static-urls targets need no credentials.
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      # Protects the mutating API (watchlist, /api/fetch). Default below is a
      # well-known DEV token so the demo stack starts out of the box — the
      # server logs a loud warning while it is in effect. REPLACE ME (set
      # AMT_API_TOKEN in .env); do not expose the default beyond localhost.
      AMT_API_TOKEN: ${AMT_API_TOKEN:-dev-insecure-token-change-me}

volumes:
  amtracker-data:
  amtracker-feeds:
