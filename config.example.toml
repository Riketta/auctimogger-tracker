# auctimogger-tracker example configuration.
# Copy to config.toml and adjust. Tokens are read from the environment only —
# never put secrets in this file.

# Louder stdout defaults for the tracker's own crates. RUST_LOG overrides
# this entirely: RUST_LOG=debug brings the noise back, or tune per crate,
# e.g. RUST_LOG="info,amtracker_infra=debug".
# debug = false

[server]
bind = "127.0.0.1:8080"
token_env = "AMT_API_TOKEN" # unset or empty = mutating endpoints are open (localhost use)
# Minimum seconds between feed re-publications per target. The scheduler
# publishes feed.lua + feed.json after successful cycles, throttled by this.
# feed_publish_secs = 300

[storage]
database = "./data/tracker.sqlite3"
raw_listing_days = 7      # raw listing working set; snapshot metadata live forever
archive_dir = "./data/raw"

[metrics]
spans = ["d1", "d7", "d14", "d30"]

[opportunities]
min_samples = 30
weights = { discount = 0.4, sale = 0.3, churn = 0.2, stability = 0.1 }

# Optional: persistent file logging. Startup-only: the subscriber is
# installed once at boot, changes require a restart. Remove the section
# to log to stdout only (systemd's journald usually suffices; otherwise
# mount a volume to keep the files).
# [logging]
# Log directory - created at boot; failure to create it aborts startup.
# dir = "logs"
# "daily" writes one file per day (auctimogger-tracker.log.2026-10-12);
# "never" appends to a single auctimogger-tracker.log (pair with an
# external rotator). Files are never pruned automatically.
# rotation = "daily"
# Independent filter for the file layer (RUST_LOG never affects it).
# Default: the tracker's own crates at debug regardless of stdout.
# level = "info,auctimogger_tracker=debug,amtracker_infra=debug,amtracker_server=debug"

# Optional: Sentry-protocol endpoint: Sentry SaaS or self-hosted GlitchTip.
# The address to report to is the DSN host - no separate URL needed.
# Remove the section (or leave dsn empty) to disable reporting entirely.
# Error-grade log lines surface as Issues; info/warn ride along as log
# breadcrumbs. Startup-only.
# [sentry]
# dsn = "http://your-key@localhost:9000/1"
# environment = "production"
# Performance-transaction sample rate (0.0..=1.0); omit for error-only
# reporting. Low rates like 0.01 keep the data volume down.
# traces_sample_rate = 0.01

# --- targets: region+realm pairs or raw URLs; add as many as you like ---

[[targets]]
id = "us-4"
kind = "blizzard-connected-realm"
region = "us"
connected_realm_id = 4
auth = { type = "bearer", env = "AMT_TOKEN" }
poll = { commodities_secs = 3600, auctions_secs = 1800 }

[[targets]]
id = "wowforever-main" # future: any conforming endpoint, world-wide
kind = "static-urls"
commodities_url = "https://example.org/api/commodities.json"
auctions_url = "https://example.org/api/auctions.json"
# auth = { type = "bearer", env = "AMT_WF_TOKEN" } # optional
poll = { commodities_secs = 3600, auctions_secs = 3600 }
