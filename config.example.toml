# auctimogger-tracker example configuration.
# Copy to config.toml and adjust. Tokens are read from the environment only —
# never put secrets in this file.

# Louder stdout defaults for the tracker's own crates. RUST_LOG overrides
# this entirely: RUST_LOG=debug brings the noise back, or tune per crate,
# e.g. RUST_LOG="info,amtracker_infra=debug".
# debug = false

[server]
bind = "127.0.0.1:8080" # `localhost:8080` also works (pinned to 127.0.0.1)
token_env = "AMT_API_TOKEN" # unset or empty = mutating endpoints are open (localhost use)
# Safety guard: with an unset/empty token, `serve` refuses to start on any
# non-loopback bind (an open mutating API must not reach the network by
# accident). Set true to accept exactly that:
# allow_open = false
# Minimum seconds between feed re-publications per target. The scheduler
# publishes feed.lua + feed.json after successful cycles, throttled by this.
# feed_publish_secs = 300

[storage]
database = "./data/tracker.sqlite3"
raw_listing_days = 7      # raw listing working set; snapshot metadata live forever
archive_dir = "./data/raw"
# Freed-space reclamation after retention prunes: "incremental" (default)
# returns freed pages once ~20% of the file is free; "full" runs a complete
# VACUUM daily instead (slower, needs free disk ~ database size); "off"
# keeps the historical never-shrink behavior.
# vacuum = "incremental"
# Feed output directory for `serve` (feed.lua / feed.json); relative paths
# resolve against the working directory serve is started from.
# feed_dir = "./feeds"
# Closed sell-through sightings older than this many days are pruned once per
# UTC day (0 = keep forever, the default). Their sale-rate aggregates live in
# the sales ledger regardless; pruning only caps the fastest-growing table.
# sight_retention_days = 30
# Scheduled online backups: with backup_dir set and backup_secs > 0, `serve`
# writes a consistent copy of the database (VACUUM INTO - safe while serving)
# to amtracker-backup-<UTC timestamp>.sqlite3 in that directory and prunes
# the oldest down to backup_keep files.
# backup_dir = "./data/backups"
# backup_secs = 86400      # one backup per day; 0 = scheduled backups off
# backup_keep = 7

[metrics]
spans = ["d1", "d7", "d14", "d30"]

[opportunities]
# Evidence floor and component weights, applied PER CATEGORY: every market
# (items, commodities, pets) ranks on its own 7-day evidence, so an item
# trading in both auction houses needs the sample count in each.
min_samples = 30
# Note: the churn component saturates at 50 unique listings/day (per
# category). Commodity markets reach that long before item/pet markets do —
# tune `weights` first if commodity rows all read as churn-capped.
weights = { discount = 0.4, sale = 0.3, churn = 0.2, stability = 0.1 }

# Alert rules (per target, managed on the /alerts page or via the API) are
# evaluated after every ingest cycle. A fired rule re-fires at most once per
# cooldown window. Rules are skipped while a target's newest feed snapshot is
# older than max_data_age_secs (0 disables the gate), so a dead feed can
# never fire an alert. Delivery: "log" records events in the UI/API only;
# "discord" posts to the webhook URL read from webhook_env; "telegram" sends
# via the bot token/chat id read from token_env/chat_id_env. Token values are
# environment variables — never put secrets in this file.
# [alerts]
# enabled = true
# cooldown_secs = 21600       # re-fire the same rule at most every 6 h
# max_data_age_secs = 172800  # skip rules while the newest feed is older than 48 h (0 = off)
# delivery = "log"
# webhook_env = "AMT_DISCORD_WEBHOOK"   # required when delivery = "discord"
# token_env = "AMT_TELEGRAM_TOKEN"      # required when delivery = "telegram"
# chat_id_env = "AMT_TELEGRAM_CHAT"

# Item/pet name resolution for the dashboard (the item catalog). Unknown ids
# resolve through Wowhead's credential-free tooltip endpoints first, with the
# authenticated Blizzard item API as fallback ("chain"). Resolved names are
# cached in the database forever per game flavor — each id is fetched once.
# [catalog]
# source = "chain"           # "chain" | "wowhead" | "blizzard"
# locale = "enUS"            # name language, game locale-code spelling
# render_resolve_max = 8     # inline lookups a table render may wait for (0 = off)
# idle_names_per_cycle = 25  # ids each ingest cycle warms in the background (0 = off)
# idle_pace_ms = 500         # sleep between two background lookups
# wowhead_base = "https://nether.wowhead.com" # explicit base override (this is the default; point at a mirror/proxy if needed — the public www site blocks non-browser traffic)

# Optional: persistent file logging. Startup-only: the subscriber is
# installed once at boot, changes require a restart. Remove the section
# to log to stdout only (systemd's journald usually suffices; otherwise
# mount a volume to keep the files).
# [logging]
# Log directory - created at boot; failure to create it aborts startup.
# dir = "logs"
# "daily" writes one file per day (auctimogger-tracker.log.2026-10-12);
# "never" appends to a single auctimogger-tracker.log (pair with an
# external rotator). Files are never pruned automatically.
# rotation = "daily"
# Independent filter for the file layer (RUST_LOG never affects it).
# Default: the tracker's own crates at debug regardless of stdout.
# level = "info,auctimogger_tracker=debug,amtracker_infra=debug,amtracker_server=debug"

# Optional: Sentry-protocol endpoint: Sentry SaaS or self-hosted GlitchTip.
# The address to report to is the DSN host - no separate URL needed.
# Remove the section (or leave dsn empty) to disable reporting entirely.
# Error-grade log lines surface as Issues; info/warn ride along as log
# breadcrumbs. Startup-only.
# [sentry]
# dsn = "http://your-key@localhost:9000/1"
# environment = "production"
# Performance-transaction sample rate (0.0..=1.0); omit for error-only
# reporting. Low rates like 0.01 keep the data volume down.
# traces_sample_rate = 0.01

# --- targets: region+realm pairs or raw URLs; add as many as you like ---

[[targets]]
id = "us-4"
kind = "blizzard-connected-realm"
region = "us"
connected_realm_id = 4
# Env var NAMES, not secrets. Tokens are fetched from the Battle.net OAuth
# endpoint and refreshed automatically ahead of expiry. A static token also
# works: auth = { type = "bearer", env = "AMT_TOKEN" }.
auth = { type = "client-credentials", client_id_env = "BLIZZARD_CLIENT_ID", client_secret_env = "BLIZZARD_CLIENT_SECRET" }
poll = { commodities_secs = 3600, auctions_secs = 1800 }

[[targets]]
id = "wowforever-main" # future: any conforming endpoint, world-wide
kind = "static-urls"
# Game flavor for catalog naming: "retail" (default), "classic-era",
# "classic", "mop-classic", or a custom key for retail-compatible private
# servers (custom keys resolve through the retail endpoints).
flavor = "forever"
commodities_url = "https://example.org/api/commodities.json"
auctions_url = "https://example.org/api/auctions.json"
# auth = { type = "bearer", env = "AMT_WF_TOKEN" } # optional
poll = { commodities_secs = 3600, auctions_secs = 3600 }
